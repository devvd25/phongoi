server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  # Tra tên "api" qua DNS của Docker theo từng request, để khi container API được tạo lại (IP đổi) Nginx vẫn trỏ đúng.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  location /api/ { proxy_pass $api; proxy_set_header Host $host; }
  location /uploads/ { proxy_pass $api; }
  location / { try_files $uri /index.html; }
}
